<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="FinanceQuizPulse">
  <defs>
    <linearGradient id="sTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16123a"/>
      <stop offset="1" stop-color="#0a0820"/>
    </linearGradient>
    <linearGradient id="sShield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.55" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="sPulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f9a8d4"/>
      <stop offset="1" stop-color="#fdba74"/>
    </linearGradient>
  </defs>

  <!-- rounded navy tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#sTile)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- trust shield outline (finance / security) -->
  <path d="M256 96 C300 120 350 132 392 140 V258 C392 350 330 408 256 440 C182 408 120 350 120 258 V140 C162 132 212 120 256 96 Z"
        fill="none" stroke="url(#sShield)" stroke-width="28" stroke-linejoin="round" opacity="0.9"/>

  <!-- heartbeat pulse inside the shield -->
  <path d="M172 262 H210 L232 218 L266 312 L292 250 H340"
        fill="none" stroke="url(#sPulse)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
