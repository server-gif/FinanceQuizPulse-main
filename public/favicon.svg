<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="FinanceQuizPulse">
  <defs>
    <linearGradient id="pTile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16123a"/><stop offset="1" stop-color="#0a0820"/></linearGradient>
    <linearGradient id="pMark" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#8b5cf6"/><stop offset="0.55" stop-color="#ec4899"/><stop offset="1" stop-color="#fb923c"/></linearGradient>
    <linearGradient id="pPulse" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f9a8d4"/><stop offset="1" stop-color="#fdba74"/></linearGradient>
  </defs>
  <!-- rounded navy tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#pTile)"/>
  <!-- "P" stem -->
  <rect x="176" y="120" width="56" height="288" rx="28" fill="url(#pMark)"/>
  <!-- "P" bowl -->
  <path d="M216 150 H300 A76 76 0 0 1 300 302 H216 V246 H292 A20 20 0 0 0 292 206 H216 Z" fill="url(#pMark)"/>
  <!-- pulse spark across the base -->
  <path d="M150 428 H206 L226 396 L256 452 L282 414 H362" fill="none" stroke="url(#pPulse)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
