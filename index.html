<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f0c29" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://securepubads.g.doubleclick.net" crossorigin />
    <!-- Fonts use the native system stack (iOS SF Pro on Apple devices) — no webfont download. -->
    <!-- Title, description, canonical and Open Graph tags are rendered per page by <SEO />. -->
    <script>
      /* Dark navy theme is the default; only an explicit "light" choice opts out. */
      (function () {
        try {
          if (localStorage.getItem('ff-theme') !== 'light') {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) { /* storage unavailable — stay dark */ }
      })();
    </script>
    <style>
      /* Instant splash shown while the app bundle loads; faded out by main.jsx. */
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: #f2f7f4;
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }
      #app-splash.is-hidden {
        opacity: 0;
        visibility: hidden;
      }
      /* Logo wrapped in a rotating brand-gradient ring */
      .app-splash__spinner {
        position: relative;
        width: 92px;
        height: 92px;
        display: grid;
        place-items: center;
        animation: app-splash-in 0.5s ease both;
      }
      .app-splash__spinner::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: conic-gradient(from 0deg, rgba(236, 72, 153, 0) 0deg, #ec4899 120deg, #fb923c 220deg, rgba(251, 146, 60, 0) 360deg);
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3.5px));
                mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3.5px));
        animation: app-splash-spin 1.15s linear infinite;
      }
      .app-splash__mark {
        width: 54px;
        height: 54px;
        display: block;
        border-radius: 14px;
        filter: drop-shadow(0 4px 12px rgba(236, 72, 153, 0.28));
      }
      .app-splash__name {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
        font-size: 1.4rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        background: linear-gradient(45deg, #f472b6 0%, #fb923c 100%);
        -webkit-background-clip: text;
                background-clip: text;
        color: transparent;
        animation: app-splash-in 0.5s ease 0.05s both;
      }
      .app-splash__dots {
        display: inline-flex;
        gap: 8px;
        animation: app-splash-in 0.5s ease 0.1s both;
      }
      .app-splash__dots i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: linear-gradient(45deg, #f472b6, #fb923c);
        animation: app-splash-dot 1.2s ease-in-out infinite;
      }
      .app-splash__dots i:nth-child(2) { animation-delay: 0.15s; }
      .app-splash__dots i:nth-child(3) { animation-delay: 0.3s; }
      @keyframes app-splash-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes app-splash-dot {
        0%, 80%, 100% { transform: translateY(0) scale(0.8); opacity: 0.45; }
        40% { transform: translateY(-5px) scale(1); opacity: 1; }
      }
      @keyframes app-splash-in {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash { transition-duration: 0.01ms; }
        .app-splash__spinner,
        .app-splash__spinner::before,
        .app-splash__name,
        .app-splash__dots { animation: none; }
        .app-splash__dots i { animation: none; opacity: 1; transform: none; }
      }
      /* Splash follows the saved dark theme too. */
      html[data-theme='dark'] #app-splash {
        background: #0f0c29;
      }
    </style>
  </head>
  <body>
    <div id="app-splash" aria-hidden="true">
      <div class="app-splash__spinner">
        <img class="app-splash__mark" src="/images/brand/logo-shield.svg" alt="" width="512" height="512" aria-hidden="true" draggable="false" />
      </div>
      <span class="app-splash__name">FinanceQuizPulse</span>
      <span class="app-splash__dots"><i></i><i></i><i></i></span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
